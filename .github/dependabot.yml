version: 2
updates:
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'monthly'
      time: '02:00'
      timezone: 'Europe/Berlin'
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'monthly'
      time: '02:00'
      timezone: 'Europe/Berlin'
    pull-request-branch-name:
      separator: '-'
    open-pull-requests-limit: 99
    target-branch: 'main'
    commit-message:
      prefix: 'chore'
      include: 'scope'
    groups:
      minor-and-patch:
        update-types:
          - 'minor'
          - 'patch'
    ignore:
      # TypeScript 7 has no JavaScript compiler API, which ts-morph and typescript-eslint need
      - dependency-name: 'typescript'
        versions:
          - '>= 7'
